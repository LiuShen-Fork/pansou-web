version: "3.3"

services:
  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/liushen-fork/pansou-web:latest}
    container_name: pansou-app
    ports:
      - "80:80"
    environment:
      # 基础配置
      - DOMAIN=${DOMAIN:-localhost}
      - PANSOU_PORT=8888
      - PANSOU_HOST=127.0.0.1

      # 数据目录（缓存、日志、SSL、管理后台数据库都在 /app/data 下）
      - CACHE_PATH=/app/data/cache
      - LOG_PATH=/app/data/logs
      - ADMIN_DB_PATH=/app/data/pansou-admin.db

      # 插件与 TG 频道默认值由镜像内 /app/upstream-defaults.env 提供，
      # 构建时从上游 fish2018/pansou 的 Dockerfile 自动抓取。
      # 需要覆盖时取消下面两行注释并填写自己的值：
      # - ENABLED_PLUGINS=pansearch,qqpd,weibo
      # - CHANNELS=tgsearchers7,Quark_Movies

      # 代理、缓存、并发、网页搜索签名与上游同步地址都可以在
      # 「管理后台 → 运行参数 / 上游自动同步」中配置，无需写在这里。
      # 下面仅作为首次启动或后台未保存记录时的默认值：
      # - PROXY=socks5://xxx.xxx.xxx.xxx:7897
      # - CACHE_ENABLED=true
      # - CACHE_TTL=60
      # - CONCURRENCY=200
      # - OUTBOUND_MAX_CONCURRENCY=128

      # 健康检查（容器内部监控）
      - HEALTH_CHECK_INTERVAL=30
      - HEALTH_CHECK_TIMEOUT=10
      - HEALTH_CHECK_RETRIES=3

      # 旧版简单认证（已由管理后台取代，保持关闭）
      # - AUTH_ENABLED=false
    volumes:
      - pansou-data:/app/data
      # 如需使用自己的 SSL 证书：
      # - ./ssl:/app/data/ssl
      # IP 归属地（可选）：把 GeoLite2-City.mmdb 放到宿主机 ./geoip，
      # 然后在「管理后台 → 认证与站点 → IP 归属地」填写 /app/data/geoip/GeoLite2-City.mmdb
      # - ./geoip:/app/data/geoip:ro
    restart: unless-stopped

volumes:
  pansou-data:
    driver: local
