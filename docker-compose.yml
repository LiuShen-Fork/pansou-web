version: "3.3"

services:
  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/willow-god/pansou-web:latest}
    container_name: pansou-app
    labels:
      - "autoheal=true"
    ports:
      - "80:80"
    environment:
      # 基础配置
      - DOMAIN=${DOMAIN:-localhost}
      - PANSOU_PORT=8888
      - PANSOU_HOST=127.0.0.1

      # 数据目录（缓存、日志、SSL、管理后台数据库都在 /app/data 下）
      - CACHE_PATH=/app/data/cache
      - LOG_PATH=/app/data/logs
      - ADMIN_DB_PATH=/app/data/pansou-admin.db

      # 插件与 TG 频道默认值由镜像内 /app/upstream-defaults.env 提供，
      # 构建时从上游 fish2018/pansou 的 Dockerfile 自动抓取。
      # 需要覆盖时取消下面两行注释并填写自己的值：
      # - ENABLED_PLUGINS=pansearch,qqpd,weibo
      # - CHANNELS=tgsearchers7,Quark_Movies

      # 代理配置（可选）
      # - PROXY=socks5://xxx.xxx.xxx.xxx:7897

      # 性能配置（镜像已包含默认值）
      # - CACHE_ENABLED=true
      # - CACHE_TTL=60
      # - MAX_CONCURRENCY=200
      # - MAX_PAGES=30

      # 健康检查（容器内部监控）
      - HEALTH_CHECK_INTERVAL=30
      - HEALTH_CHECK_TIMEOUT=10
      - HEALTH_CHECK_RETRIES=3

      # 旧版简单认证（已由管理后台取代，保持关闭）
      # - AUTH_ENABLED=false
    volumes:
      - pansou-data:/app/data
      # 如需使用自己的 SSL 证书：
      # - ./ssl:/app/data/ssl
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: pansou-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pansou-data:
    driver: local
